name: Publish scheduled blogs
on:
  schedule:
    - cron: '7,37 5-11 * * 2,4'
    - cron: '27 12-15 * * 2,4'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - id: pub
        run: python3 .github/scripts/publish_due.py
      - name: Commit and push
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "Halo blog publisher"
            git config user.email "hello@myhaloapp.co.uk"
            git add -A
            git commit -m "Publish: ${{ steps.pub.outputs.titles }}"
            git push
            gh api -X POST repos/${{ github.repository }}/pages/builds || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}
